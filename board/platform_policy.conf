# =============================================================================
# platform_policy.conf -- per-board-target platform policy.
#
# Requirement trace:
#   NPIEDRONE-294  "core eligibility rules, including pinned real-time cores,
#                   reserved OS cores, and forbidden migration zones defined by
#                   platform policy"
#   NPIEDRONE-294  "Dynamic allocation policies and thresholds shall be
#                   configurable and version-controlled per board target"
#
# This file is the single place where the core partition is declared. Nothing
# in setup_board.sh, the probe, or the allocator hardcodes it. Change the
# policy here, re-run setup_board.sh, and the emitted platform descriptor --
# which the offline allocator consumes -- follows automatically.
#
# Sourced by setup_board.sh. Keep it valid bash.
# =============================================================================

PLATFORM_NAME="imx95-19x19-verdin"
POLICY_VERSION="1"

# ---------------------------------------------------------------------------
# Core roles, one token per core, in core_id order.
#
#   os           OS + interrupts live here. Noisiest tail. Still allocatable,
#                but only for tiers listed in TIERS_os below.
#   general      Not isolated. Runs OS work if the scheduler wants to.
#   rt_reserved  Isolated (isolcpus/nohz_full/rcu_nocbs). Quietest tail.
#                Reserved for hard real-time control.
#
# MUST match the kernel cmdline. If the cmdline says isolcpus=4,5 then cores
# 4 and 5 must be rt_reserved here -- setup_board.sh cross-checks and fails
# loudly if the two disagree, because a policy that lies about the platform is
# worse than no policy.
#
# Current company image: isolcpus=4,5 nohz_full=4,5 rcu_nocbs=4,5
# ---------------------------------------------------------------------------
CORE_ROLES="os general general general rt_reserved rt_reserved"

# ---------------------------------------------------------------------------
# Which criticality tiers each role may host. This is the eligibility rule the
# allocator must respect -- "preventing AI workload migration onto cores
# reserved for hard real-time control" cuts both ways: HARD_RT should not land
# on a noisy core, and best-effort work should not land on a reserved one.
#
# Space-separated tier names, or "none".
# ---------------------------------------------------------------------------
TIERS_os="SOFT"
TIERS_general="SOFT FIRM_RT"
TIERS_rt_reserved="HARD_RT FIRM_RT"

# ---------------------------------------------------------------------------
# Cores permitted to receive hardware interrupts. Anything not listed here is
# kept interrupt-free as far as the kernel allows (per-CPU IRQs such as the
# arch timer and IPIs cannot be moved and are reported, not fought).
#
# Format: a cpu list as accepted by /proc/irq/*/smp_affinity_list, e.g.
# "0" or "0-3" or "0,2".
# ---------------------------------------------------------------------------
IRQ_CORES="0-3"

# ---------------------------------------------------------------------------
# Network interfaces to switch into threaded NAPI, moving packet processing
# out of softirq context into schedulable kernel threads that can be kept off
# the reserved cores. Matches the company rt-setup.sh behaviour.
# ---------------------------------------------------------------------------
NET_IFACES="eth0 eth1 eth2"

# CPU affinity applied to the napi/ksoftirq kernel threads once threaded.
NAPI_THREAD_CORES="0-3"

# ---------------------------------------------------------------------------
# Thermal guardrails (NPIEDRONE-294: "enforce thermal and power guardrails and
# trigger derating policy before exceeding configured thermal thresholds").
# Degrees C. Only zones whose sysfs `type` matches THERMAL_ZONE_MATCH are
# treated as real sensors -- several i.MX zones report a fixed trip constant.
# ---------------------------------------------------------------------------
# Anchored on purpose: a loose pattern like "soc" also matches `pf53_soc`,
# which is a fixed 105000 trip constant, not a sensor -- that would fail the
# thermal gate on a board sitting at 55C.
THERMAL_ZONE_MATCH="^a55-thermal$|^ana$"
THERMAL_WARN_C=85
THERMAL_CRIT_C=95

# ---------------------------------------------------------------------------
# Measurement acceptance gate. A measurement session is only valid if the
# platform met these. Recorded in the emitted descriptor either way.
# ---------------------------------------------------------------------------
REQUIRE_PREEMPT_RT=1        # 1 = fail setup if the kernel is not PREEMPT_RT
REQUIRE_ISOLATION=1         # 1 = fail setup if no isolcpus is present
